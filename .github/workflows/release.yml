name: Release extension

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  CGO_ENABLED: '0'
  GOWORK: 'off'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
      - name: Test
        shell: bash
        run: |
          message=$(git log -1 --format=%B)
          if [[ "$message" == *"[skip tests]"* ]]; then
            echo 'Skipping tests as requested by the release commit.'
            exit 0
          fi
          go test -mod=readonly ./...
      - name: Build extension archives
        shell: python3 {0}
        run: |
          import hashlib
          import itertools
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          tag = os.environ['RELEASE_TAG']
          manifest = json.loads(Path('resources/extension.json').read_text())
          checksums = []
          for goos, goarch in itertools.product(('linux', 'darwin', 'windows'), ('amd64', 'arm64')):
              staging = Path('dist/staging')
              shutil.rmtree(staging, ignore_errors=True)
              package = staging / manifest['id']
              shutil.copytree('resources', package / 'resources')
              for name in ('LICENSE', 'README.md'):
                  shutil.copy2(name, package / name)
              entry = manifest['entry'].removesuffix('.exe')
              if goos == 'windows':
                  entry += '.exe'
              packaged_manifest = manifest | {'entry': entry, 'version': tag.removeprefix('v')}
              (package / 'resources/extension.json').write_text(
                  json.dumps(packaged_manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              subprocess.run(
                  ['go', 'build', '-mod=readonly', '-trimpath', '-ldflags=-s -w', '-o', str(package / entry), '.'],
                  env=os.environ | {'GOOS': goos, 'GOARCH': goarch}, check=True)
              archive = Path(shutil.make_archive(
                  str(Path('dist') / f"{manifest['id']}-{tag}-{goos}-{goarch}"),
                  'zip', staging, manifest['id']))
              with archive.open('rb') as stream:
                  checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
              checksums.append(f'{checksum}  {archive.name}\n')
          shutil.rmtree(staging)
          Path('dist/SHA256SUMS').write_text(''.join(checksums), encoding='utf-8')
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
          else
            flags=(--verify-tag --generate-notes)
            if [[ "${RELEASE_TAG#v}" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS "${flags[@]}"
          fi
